[gcode_macro BELT_RESONANCES]
description: Measure CoreXY belt resonances and generate a comparison graph
gcode:
    CALIBRATION_RECORD TYPE=belt_resonances STATUS=started
    M117 Belt resonance tests
    HOME_ALL
    MEASURE_AXES_NOISE
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=belt_a
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=belt_b
    M117 Generating belt graph
    RUN_SHELL_COMMAND CMD=generate_belt_resonance_graph
    CALIBRATION_RECORD TYPE=belt_resonances STATUS=completed DETAILS=graph_generated
    M117 Belt graph complete

[gcode_macro AUTO_CALIBRATE]
description: Calibrate both input-shaper axes and generate X/Y graphs
gcode:
    CALIBRATION_RECORD TYPE=auto_calibrate STATUS=started
    M117 Input shaper calibration
    HOME_ALL
    MEASURE_AXES_NOISE
    SHAPER_CALIBRATE NAME=auto_calibrate
    M117 Generating shaper graphs
    RUN_SHELL_COMMAND CMD=generate_input_shaper_graphs
    CALIBRATION_RECORD TYPE=auto_calibrate STATUS=completed DETAILS=graphs_generated_not_saved
    M117 Shaper calibration complete
