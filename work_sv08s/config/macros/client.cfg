# Supported customization for the unmodified mainsail.cfg client macros.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 0.0
variable_custom_park_y: 0.0
variable_custom_park_dz: 10.0
variable_retract: 1.0
variable_unretract: 1.0
variable_speed_move: 150.0
variable_park_at_cancel: False
variable_park_at_cancel_x: 0.0
variable_park_at_cancel_y: 350.0
# The SV08 cancel hook owns its guarded retract and parking.
variable_cancel_retract: 0.0
variable_idle_timeout: 1800
variable_runout_sensor: 'filament_switch_sensor filament_sensor'
variable_user_pause_macro: '_SV_PAUSE_SETUP'
variable_user_resume_macro: '_SV_RESUME_CHECK'
variable_user_cancel_macro: '_SV_CANCEL_CLEANUP'
gcode:

[gcode_macro _SV_PAUSE_SETUP]
gcode:
    # Preserve Mainsail's saved target but move restoration behind its
    # filament gate and the pilot resume hook.
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': False, 'temp': printer['gcode_macro RESUME'].last_extruder_temp.temp}}"
    _LCD_STATUS_PAUSED

[gcode_macro _SV_RESUME_CHECK]
gcode:
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("There is no paused print to resume.")}
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("Resume unavailable: position was lost. Cancel the print.")}
    {% endif %}
    {% set sensor = printer['filament_switch_sensor filament_sensor'] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("Resume blocked: load filament and confirm it before resuming.")}
    {% endif %}
    {% if printer['gcode_macro _FILAMENT_LOAD'].active %}
        {action_raise_error("Resume blocked: confirm or cancel the active Load Filament operation.")}
    {% endif %}
    {% set resume_temperature = printer['gcode_macro RESUME'].last_extruder_temp.temp|float %}
    {% if resume_temperature < printer.configfile.settings.extruder.min_extrude_temp %}
        {action_raise_error("Resume unavailable: the saved nozzle target is below extrusion temperature.")}
    {% endif %}
    M109 S{resume_temperature}
    {% if printer['gcode_macro _FILAMENT_CHANGE'].active %}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
        # Mainsail adds its normal 1mm after this hook: 2 + 1 = 3mm.
        _CLIENT_EXTRUDE LENGTH=2 SPEED=2.5
        _RESET_FILAMENT_CHANGE
    {% endif %}
    _LCD_STATUS_PRINTING

[gcode_macro _SV_CANCEL_CLEANUP]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    _LCD_STATUS_ERROR
    M400
    {% if not printer['gcode_macro _FILAMENT_CHANGE'].active %}
        _CLIENT_RETRACT LENGTH=15 SPEED=45
    {% endif %}
    _END_PRINT_PARK
    _ALL_FAN_OFF
    BED_MESH_CLEAR
    _RESET_FILAMENT_CHANGE
    M84

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.pause_resume.is_paused %}
        # Preserve the bed and trusted XYZ position during an extended pause.
        # The pause hook preserved the print target; the resume hook restores
        # it with M109 after filament and load-confirmation checks.
        M104 S175
        RESPOND TYPE=echo MSG="Pause standby: bed and motors remain on; nozzle target reduced to 175C."
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[gcode_macro M600]
description: Pause, unload hot and release E for manual feeding and purging
gcode:
    {% if printer['gcode_macro _FILAMENT_CHANGE'].active %}
        {action_raise_error("Filament change already active; manually load and purge, then RESUME.")}
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("M600 requires homed axes.")}
    {% endif %}
    # Suppress the ordinary park retract; unload owns the full 53mm.
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=retract VALUE=0.0
    {% if not printer.pause_resume.is_paused %}
        PAUSE {rawparams}
    {% endif %}
    _FILAMENT_HEAT
    _FILAMENT_CHANGE_UNLOAD

[gcode_macro END_PRINT]
description: Retract, park, shut down, and run the exhaust for 10 minutes
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    M400
    {% if not printer['gcode_macro _FILAMENT_CHANGE'].active %}
        _CLIENT_RETRACT LENGTH=15 SPEED=45
    {% endif %}
    _END_PRINT_PARK
    TURN_OFF_HEATERS
    _ALL_FAN_OFF
    BED_MESH_CLEAR
    CLEAR_PAUSE
    _RESET_FILAMENT_CHANGE
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    M84
    M220 S100
    M221 S100
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1
    UPDATE_DELAYED_GCODE ID=_END_PRINT_EXHAUST_OFF DURATION=600
    _LCD_STATUS_COMPLETE
    M117 Print complete

[delayed_gcode _END_PRINT_EXHAUST_OFF]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro _END_PRINT_PARK]
gcode:
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set z = [printer.gcode_move.gcode_position.z + 25,
                     printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z]|min %}
        G90
        G1 Z{z} F1200
        G1 X0 Y360 F9000
    {% endif %}
