[gcode_macro MULTI_PID_CALIBRATE]
gcode:
    # 1. Fetch parameters with safe defaults
    {% set target_extruder = params.EXT|default(270)|float %}
    {% set target_bed = params.BED|default(70)|float %}
    {% set save_flag = params.SAVE|default('yes')|string|lower %}

    CALIBRATION_RECORD TYPE=pid_multi STATUS=started DETAILS=extruder_{target_extruder|int}C_bed_{target_bed|int}C_save_{save_flag}
    HOME_ALL
    G90
    G1 Z150 F1200
    # 2. Run extruder calibration
    M117 Calibrating extruder to {target_extruder}C...
    RESPOND MSG="Starting extruder PID calibration..."
    PID_CALIBRATE HEATER=extruder TARGET={target_extruder}

    # 3. Run bed calibration
    M117 Calibrating bed to {target_bed}C...
    RESPOND MSG="Starting bed PID calibration..."
    PID_CALIBRATE HEATER=heater_bed TARGET={target_bed}

    CALIBRATION_RECORD TYPE=pid_multi STATUS=completed DETAILS=extruder_{target_extruder|int}C_bed_{target_bed|int}C_save_requested_{save_flag}

    # 4. Conditional Save Config block
    {% if save_flag == 'yes' %}
        M117 Saving configuration and restarting...
        RESPOND MSG="SAVE=yes detected. Saving configuration now."
        SAVE_CONFIG
    {% else %}
        M117 Calibration complete!
        RESPOND MSG="Calibration finished. Values NOT saved."
    {% endif %}
