[delayed_gcode _disable_filament_sensor_at_ready]
initial_duration: 0.1
gcode:
    # Idle motion makes Klipper's idle_timeout report Printing, so suppress
    # native runout events until START_PRINT has validated filament presence.
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

[gcode_macro _FILAMENT_CHANGE]
variable_active: False
variable_resume_target: 0.0
gcode:

[gcode_macro _RESET_FILAMENT_CHANGE]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE VARIABLE=resume_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=retract VALUE=1.0
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=cancel_retract VALUE=0.0

[gcode_macro _FILAMENT_CHANGE_UNLOAD]
gcode:
    {% if not printer.pause_resume.is_paused or not printer.extruder.can_extrude %}
        {action_raise_error("M600 unload requires a paused printer and hot nozzle.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=m600_unload_state
    M83
    G1 E-3 F2700
    G1 E-50 F3000
    M400
    RESTORE_GCODE_STATE NAME=m600_unload_state
    RELEASE_EXTRUDER
    SET_GCODE_VARIABLE MACRO=_FILAMENT_CHANGE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=retract VALUE=1.0
    # Already unloaded: cancellation must not pull another 15mm.
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=cancel_retract VALUE=0.0
    M117 Manually load and purge, then RESUME

[gcode_macro RELEASE_EXTRUDER]
description: Release E for manual feeding; pause before using during a print
gcode:
    {% if printer.print_stats.state == 'printing' and not printer.pause_resume.is_paused %}
        {action_raise_error("Pause before releasing the extruder.")}
    {% endif %}
    M400
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro LOAD_FILAMENT]
description: Heat for manual loading and wait for operator confirmation
gcode:
    {% set initial_target = printer.extruder.target|float %}
    {% if printer['gcode_macro _FILAMENT_LOAD'].active %}
        {action_raise_error("Load Filament is already waiting for confirmation.")}
    {% endif %}
    _FILAMENT_HEAT
    _BEGIN_FILAMENT_LOAD RESTORE_TARGET={initial_target}

[gcode_macro _FILAMENT_LOAD]
variable_active: False
variable_restore_target: 0.0
gcode:

[gcode_macro _BEGIN_FILAMENT_LOAD]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD VARIABLE=restore_target VALUE={params.RESTORE_TARGET|float}
    M117 Manually load filament
    RESPOND TYPE=command MSG="action:prompt_begin Confirm filament load"
    RESPOND TYPE=command MSG="action:prompt_text Manually feed and purge filament, then confirm. No automatic extrusion will occur."
    RESPOND TYPE=command MSG="action:prompt_footer_button Filament loaded|CONFIRM_FILAMENT_LOADED|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|CANCEL_FILAMENT_LOAD|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CONFIRM_FILAMENT_LOADED]
gcode:
    {% set load = printer['gcode_macro _FILAMENT_LOAD'] %}
    {% set sensor = printer['filament_switch_sensor filament_sensor'] %}
    {% if not load.active %}
        {action_raise_error("No Load Filament operation is waiting for confirmation.")}
    {% endif %}
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("Filament is not detected. Insert filament before confirming.")}
    {% endif %}
    M104 S{load.restore_target}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD VARIABLE=active VALUE=False
    M117 Filament loaded - press RESUME
    RESPOND TYPE=echo MSG="Filament load confirmed. Previous nozzle target restored; press RESUME when ready."
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro CANCEL_FILAMENT_LOAD]
gcode:
    {% set load = printer['gcode_macro _FILAMENT_LOAD'] %}
    {% if load.active %}
        M104 S{load.restore_target}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD VARIABLE=active VALUE=False
    {% endif %}
    M117 Filament load canceled
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro UNLOAD_FILAMENT]
description: Heat and unload filament without changing the caller's G-code modes
gcode:
    _FILAMENT_HEAT
    _UNLOAD_FILAMENT_MOVES

[gcode_macro _FILAMENT_HEAT]
gcode:
    {% if printer.print_stats.state == 'printing' %}
        {action_raise_error("Pause before loading or unloading filament.")}
    {% endif %}
    {% set load = printer['gcode_macro _PILOT_SETTINGS'].load_temperature|float %}
    {% set minimum = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set maximum = printer.configfile.settings.extruder.max_temp|float %}
    {% if load <= minimum or load >= maximum %}
        {action_raise_error("The configured filament loading temperature is invalid.")}
    {% endif %}
    # Always establish the configured loading target, including from pause standby.
    # M109 waits before the caller unloads or opens the manual-load prompt.
    M109 S{load}


[gcode_macro _UNLOAD_FILAMENT_MOVES]
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Nozzle is too cold to unload filament.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_filament_state
    M83
    G1 E25 F300
    G1 E-10 F1500
    G1 E-20 F600
    M400
    G4 P3000
    G1 E-50 F300
    M400
    RESTORE_GCODE_STATE NAME=unload_filament_state
    RELEASE_EXTRUDER
    {% if not printer.pause_resume.is_paused %}
        M104 S0
    {% endif %}
    M117 Filament unloaded
