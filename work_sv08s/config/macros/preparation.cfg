[gcode_macro _PILOT_SETTINGS]
# Set only after physical tap calibration and acceptance are recorded.
variable_tap_validated: True
variable_tap_temperature: 150
variable_heat_soak_minutes: 15
variable_load_temperature: 240
gcode:

[gcode_macro _HEAT_SOAK]
description: Hold the heated bed for a visible, validated duration
gcode:
    {% set minutes = params.MINUTES|default(0)|float %}
    {% if minutes <= 0 %}
        {action_raise_error("Heat-soak duration must be greater than zero minutes.")}
    {% endif %}
    {% set milliseconds = (minutes * 60000)|int %}
    M117 Heat soaking {minutes|round(1)} min
    RESPOND MSG="Heat soak started: {minutes|round(1)} minutes"
    G4 P{milliseconds}
    RESPOND MSG="Heat soak complete"
    M117 Heat soak complete

[gcode_macro EDDY_INITIAL_SETUP]
description: Bootstrap uncalibrated Eddy only; requires manual positioning
variable_started: False
gcode:
    {% set cf = printer.configfile %}
    {% set section = 'probe_eddy_current eddy' %}
    # config includes printer.cfg SAVE_CONFIG data and included configuration.
    {% if section not in cf.config or cf.save_config_pending_items is not defined %}
        {action_raise_error("Cannot verify Eddy calibration state; setup blocked.")}
    {% endif %}
    {% set pending = cf.save_config_pending_items.get(section, {}) or {} %}
    {% if 'calibrate' in cf.config[section] or 'calibrate' in pending %}
        {action_raise_error("Eddy calibration already exists or awaits SAVE_CONFIG; initial setup blocked.")}
    {% endif %}
    {% if started %}
        {action_raise_error("Initial setup already started this session; complete or abort calibration and restart before retrying.")}
    {% endif %}
    {% if printer.pause_resume.is_paused or printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Initial Eddy setup requires an idle printer.")}
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        {action_raise_error("Home X and Y with sensorless helpers before initial Eddy setup; do not home Z.")}
    {% endif %}
    {% if params.CONFIRM_POSITION|default('0') != '1' %}
        {action_raise_error("Manually level the bed and position the nozzle near bed center, roughly 20mm above it, then use CONFIRM_POSITION=1.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=EDDY_INITIAL_SETUP VARIABLE=started VALUE=True
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=1
    SET_KINEMATIC_POSITION Z=25 SET_HOMED=Z
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy

[gcode_macro START_PRINT]
description: Home, heat, level, clean, tap, scan and reach print temperature
gcode:
    {% set bed = params.BED_TEMP|default(70)|float %}
    {% set nozzle = params.EXTRUDER_TEMP|default(260)|float %}
    {% set soak = params.HEATSOAK|default(printer['gcode_macro _PILOT_SETTINGS'].heat_soak_minutes)|float %}
    {% if soak < 0 %}
        {action_raise_error("HEATSOAK must be zero or a positive duration in minutes.")}
    {% endif %}
    {% set settings = printer.configfile.settings %}
    {% set sensor = printer['filament_switch_sensor filament_sensor'] %}
    {% if sensor.enabled and not sensor.filament_detected %}
        {action_raise_error("START_PRINT aborted: insert filament.")}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {action_raise_error("Cancel the paused print before starting another.")}
    {% endif %}
    {% if not (0 < bed < settings.heater_bed.max_temp) or
          not (settings.extruder.min_extrude_temp <= nozzle < settings.extruder.max_temp) %}
        {action_raise_error("Requested printing temperature is outside the allowed range.")}
    {% endif %}
    # Fail before any preparation if tap commissioning is incomplete.
    _CHECK_TAP_READY
    _LCD_STATUS_PREHEATING
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0 MOVE=0
    M220 S100
    M221 S100
    G90
    M104 S125
    HOME_ALL
    M190 S{bed}
    {% if soak %}
        _HEAT_SOAK MINUTES={soak}
    {% endif %}
    QUAD_GANTRY_LEVEL
    G28 Z
    CLEAN_NOZZLE
    TAP_REFERENCE
    BED_MESH_CALIBRATE METHOD=scan ADAPTIVE=1
    M190 S{bed}
    _HEAT_AT_PURGE_START TEMPERATURE={nozzle}
    _PURGE_LINE
    _LCD_STATUS_PRINTING
    M117 Printing

[gcode_macro _HEAT_AT_PURGE_START]
description: Move safely to the purge start before waiting for print temperature
gcode:
    {% set temperature = params.TEMPERATURE|default(0)|float %}
    {% set settings = printer.configfile.settings.extruder %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("Purge preheat requires homed axes.")}
    {% endif %}
    {% if not (settings.min_extrude_temp <= temperature < settings.max_temp) %}
        {action_raise_error("Purge preheat temperature is outside the allowed range.")}
    {% endif %}
    G90
    G1 Z{[printer.gcode_move.gcode_position.z, 5]|max} F1200
    G1 X0.5 Y0.5 F9000
    M109 S{temperature}

[gcode_macro _PURGE_LINE]
description: Restore 15mm withdrawal and purge immediately before printing
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes or not printer.extruder.can_extrude %}
        {action_raise_error("Purge requires homed axes and a hot nozzle.")}
    {% endif %}
    {% set sensor = printer['filament_switch_sensor filament_sensor'] %}
    {% if printer.pause_resume.is_paused or (sensor.enabled and not sensor.filament_detected) %}
        {action_raise_error("Purge blocked: printer paused or filament missing.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=purge_line_state
    G90
    M83
    G1 Z5 F1200
    G1 X0.5 Y0.5 F9000
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    G1 E15 F500
    G1 Z0.6 F500
    # Split 39.9mm over two 100mm strokes for the 0.4mm nozzle limit.
    G1 X100.5 E19.95 F900
    G1 Y2.5 F900
    G1 X0.5 E19.95 F900
    G1 Z5 F1200
    M400
    RESTORE_GCODE_STATE NAME=purge_line_state

[gcode_macro PREPARE_QGL]
description: Heat bed, home and level; native QGL options pass through
gcode:
    {% set bed = params.BED_TEMP|default(70)|float %}
    {% if bed <= 0 or bed >= printer.configfile.settings.heater_bed.max_temp %}
        {action_raise_error("Requested bed temperature is outside the allowed range.")}
    {% endif %}
    M190 S{bed}
    HOME_ALL
    QUAD_GANTRY_LEVEL {% for key, value in params.items() if key != 'BED_TEMP' %}{key}={value} {% endfor %}
    G28 Z

[gcode_macro GENERATE_PRINT_MESH]
description: Scan a homed bed; native mesh options pass through
gcode:
    _REQUIRE_HOMED
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD={params.METHOD|default('scan')} {% for key, value in params.items() if key != 'METHOD' %}{key}={value} {% endfor %}

[gcode_macro G34]
description: Prepare QGL with the pilot's homing sequence
gcode:
    PREPARE_QGL {rawparams}

[gcode_macro _CHECK_TAP_READY]
gcode:
    {% if params.REQUIRE_VALIDATED|default(1)|int and not printer['gcode_macro _PILOT_SETTINGS'].tap_validated %}
        {action_raise_error("Pilot tap commissioning is pending; START_PRINT is not yet enabled.")}
    {% endif %}
    {% set settings = printer.configfile.settings %}
    {% if settings['probe_eddy_current eddy'].tap_threshold|default(0)|float <= 0 %}
        {action_raise_error("Native Eddy tap_threshold calibration is required.")}
    {% endif %}
    {% if not settings.force_move.enable_force_move|default(False) %}
        {action_raise_error("Controlled tap reference requires enable_force_move.")}
    {% endif %}
    {% set temperature = printer['gcode_macro _PILOT_SETTINGS'].tap_temperature|float %}
    {% if not (0 < temperature <= 150) %}
        {action_raise_error("Pilot tap temperature must be greater than zero and at most 150C.")}
    {% endif %}
    {% set reference = settings.bed_mesh.zero_reference_position|default([]) %}
    {% if reference|length != 2 or reference[0]|float != 175 or reference[1]|float != 175 %}
        {action_raise_error("Bed mesh zero reference must match the nozzle tap point 175,175.")}
    {% endif %}

[gcode_macro TAP_REFERENCE]
description: Tap a clean nozzle at bed center and apply its measured Z reference
gcode:
    # Standalone commissioning is allowed; START_PRINT checks the acceptance flag.
    _CHECK_TAP_READY REQUIRE_VALIDATED=0
    _CHECK_TAP_STATE
    G90
    G1 Z{[printer.gcode_move.position.z, 10]|max} F1200
    M109 S{printer['gcode_macro _PILOT_SETTINGS'].tap_temperature}
    G1 X175 Y175 F6000
    G1 Z10 F1200
    _PROBE_TAP_REFERENCE

[gcode_macro _CHECK_TAP_STATE]
description: Reject tap reference with lost homing, pause, mesh or shifted coordinates
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes or not printer.quad_gantry_level.applied %}
        {action_raise_error("Tap reference requires homed XYZ and completed QGL.")}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {action_raise_error("Tap reference is not allowed during a pause.")}
    {% endif %}
    {% if printer.bed_mesh.profile_name %}
        {action_raise_error("Clear the bed mesh before tap reference.")}
    {% endif %}
    {% for axis in ['x', 'y', 'z'] %}
        {% if (printer.gcode_move.position[axis] - printer.gcode_move.gcode_position[axis])|abs > 0.0001 %}
            {action_raise_error("Tap reference requires unshifted XYZ G-code coordinates.")}
        {% endif %}
    {% endfor %}

[gcode_macro _PROBE_TAP_REFERENCE]
description: Check cooled tap position, sample contact and apply only a successful result
gcode:
    {% set position = printer.gcode_move.position %}
    {% set temperature = printer['gcode_macro _PILOT_SETTINGS'].tap_temperature|float %}
    {% if (position.x - 175)|abs > 0.01 or (position.y - 175)|abs > 0.01 or (position.z - 10)|abs > 0.01 %}
        {action_raise_error("Tap must start at nozzle X175 Y175 Z10.")}
    {% endif %}
    {% if not (temperature - 2 <= printer.extruder.temperature <= temperature + 2) %}
        {action_raise_error("Nozzle has not reached the tap temperature window.")}
    {% endif %}
    _CHECK_TAP_STATE
    # Native sampling rejects disagreement; do not retry a failed contact automatically.
    SET_GCODE_VARIABLE MACRO=_APPLY_TAP_REFERENCE VARIABLE=ready VALUE=False
    PROBE METHOD=tap SAMPLES=3 SAMPLE_RETRACT_DIST=5 SAMPLES_TOLERANCE=0.025 SAMPLES_TOLERANCE_RETRIES=0
    SET_GCODE_VARIABLE MACRO=_APPLY_TAP_REFERENCE VARIABLE=ready VALUE=True
    _APPLY_TAP_REFERENCE

[gcode_macro _APPLY_TAP_REFERENCE]
description: Consume one successful tap before evaluating its Z correction
variable_ready: False
gcode:
    {% if not ready %}
        {action_raise_error("No fresh tap result is available; run TAP_REFERENCE.")}
    {% endif %}
    # Consume first, so a rejected result cannot be applied by retrying this helper.
    SET_GCODE_VARIABLE MACRO=_APPLY_TAP_REFERENCE VARIABLE=ready VALUE=False
    _COMMIT_TAP_REFERENCE

[gcode_macro _COMMIT_TAP_REFERENCE]
description: Apply the preceding tap measurement to Z without declaring any axes homed
gcode:
    {% set result = printer.probe.last_probe_position %}
    {% set position = printer.gcode_move.position %}
    {% set corrected_z = position.z - result.z %}
    {% if not (-1 <= result.z <= 1) %}
        {action_raise_error("Tap correction exceeds the pilot +/-1mm acceptance bound; inspect calibration and nozzle cleanliness.")}
    {% endif %}
    {% if (result.x - 175)|abs > 0.01 or (result.y - 175)|abs > 0.01 or (position.x - 175)|abs > 0.01 or (position.y - 175)|abs > 0.01 %}
        {action_raise_error("Tap result and current nozzle must be at the reference point.")}
    {% endif %}
    {% if not (0 < corrected_z <= printer.toolhead.axis_maximum.z) %}
        {action_raise_error("Tap produced an invalid corrected toolhead height.")}
    {% endif %}
    _CHECK_TAP_STATE
    # last_probe_position already includes calibrated tap_z_offset. Do not add it again.
    SET_KINEMATIC_POSITION Z={corrected_z} SET_HOMED=
    G90
    G1 Z10 F1200
    M117 Tap reference applied
