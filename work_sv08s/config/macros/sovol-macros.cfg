# SV08-specific orchestration; mainsail.cfg owns pause/resume/cancel.

[force_move]
# Used only for guarded initial setup and measured print-time tap Z reference.
# Production macros never call FORCE_MOVE.
enable_force_move: True

[gcode_macro MAINLED_ON]
gcode:
    SET_LED LED=main_led WHITE=1

[gcode_macro MAINLED_OFF]
gcode:
    SET_LED LED=main_led WHITE=0

[gcode_macro MAINLED_TOG]
gcode:
    SET_LED LED=main_led WHITE={0 if printer['led main_led'].color_data[0][3] > 0 else 1} SYNC=0

[gcode_macro _ALL_FAN_OFF]
gcode:
    M107
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
