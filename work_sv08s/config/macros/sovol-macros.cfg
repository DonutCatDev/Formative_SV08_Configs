# SV08-specific orchestration; mainsail.cfg owns pause/resume/cancel.

[force_move]
# Used only for guarded initial setup and measured print-time tap Z reference.
# Production macros never call FORCE_MOVE.
enable_force_move: True

[gcode_macro MAINLED_ON]
gcode:
    SET_LED LED=main_led WHITE=1

[gcode_macro MAINLED_OFF]
gcode:
    SET_LED LED=main_led WHITE=0

[gcode_macro MAINLED_TOG]
gcode:
    SET_LED LED=main_led WHITE={0 if printer['led main_led'].color_data[0][3] > 0 else 1} SYNC=0

[gcode_macro M106]
description: Set the part fan, or map OrcaSlicer P3 to the exhaust fan
rename_existing: M106_BASE
gcode:
    {% set fan_index = params.P|int if params.P is defined else 0 %}
    {% set speed = params.S|float if params.S is defined else 255.0 %}
    {% if speed < 0 or speed > 255 %}
        {action_raise_error("M106 S must be between 0 and 255.")}
    {% elif fan_index == 0 %}
        M106_BASE S{speed}
    {% elif fan_index == 3 %}
        UPDATE_DELAYED_GCODE ID=_END_PRINT_EXHAUST_OFF DURATION=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED={speed / 255.0}
    {% else %}
        {action_raise_error("Unsupported fan index P%d; use P0 for part cooling or P3 for exhaust." % fan_index)}
    {% endif %}

[gcode_macro M107]
description: Stop the part fan, or map OrcaSlicer P3 to the exhaust fan
rename_existing: M107_BASE
gcode:
    {% set fan_index = params.P|int if params.P is defined else 0 %}
    {% if fan_index == 0 %}
        M107_BASE
    {% elif fan_index == 3 %}
        UPDATE_DELAYED_GCODE ID=_END_PRINT_EXHAUST_OFF DURATION=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        {action_raise_error("Unsupported fan index P%d; use P0 for part cooling or P3 for exhaust." % fan_index)}
    {% endif %}

[gcode_macro _ALL_FAN_OFF]
gcode:
    M107
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
