# Home/status screen customization for the stock Sovol LCD.
# Loaded by machine.cfg's options/lcd/*.cfg include.
# Selected by display_group: sv08_home in lcd.cfg.
# Source: upstream Klipper klippy/extras/display/display.cfg, _default_16x4.
# https://github.com/Klipper3d/klipper/blob/master/klippy/extras/display/display.cfg
# Initial layout copies the stock data items and uses upstream helper templates
# and glyphs, which Klipper loads automatically (no extra include needed).
# Positions are zero-based row, column: rows 0-3, columns 0-15.
# Each item draws at its position; leave room for its text/icons to avoid overlap.
# Future pages can use additional group names and SET_DISPLAY_GROUP GROUP=name.
# Return to this page: SET_DISPLAY_GROUP GROUP=sv08_home
# Return to upstream stock: SET_DISPLAY_GROUP GROUP=_default_16x4
# Encoder page cycling is not enabled by this file.

# Row 0: active hotend current/target temperatures and part-cooling fan speed.
[display_data sv08_home extruder]
position: 0, 0
text:
    {% set active_extruder = printer.toolhead.extruder %}
    { render("_heater_temperature", param_heater_name=active_extruder) }

[display_data sv08_home fan]
position: 0, 10
text: { render("_fan_speed") }

# Row 1: bed temperature and slicer-based estimated completion clock.
[display_data sv08_home heater_bed]
position: 1, 0
text:
    ~bed~
    { "%3.0f" % printer.heater_bed.temperature }

[display_data sv08_home eta]
position: 1, 8
text: ETA:{ printer.lcd_vsd_browser.slicer_completion if 'lcd_vsd_browser' in printer else '----' }

# Row 2: progress percentage/bar and stock printing timer.
[display_data sv08_home print_progress]
position: 2, 0
text: { "{:^10.0%}".format(printer.display_status.progress) }

[display_data sv08_home progress_bar]
# Sorted after the percentage item, so graphics are drawn over the same area.
position: 2, 1
text: { draw_progress_bar(2, 0, 10, printer.display_status.progress) }

[display_data sv08_home printing_time]
position: 2, 10
text: { "%6s" % (render("_printing_time").strip(),) }

# Row 3: M117 message first, otherwise XYZ while the stock timer is nonzero,
# otherwise Ready. Retain this helper to preserve existing macro feedback.
[display_data sv08_home print_status]
position: 3, 0
text: { render("_print_status") }
