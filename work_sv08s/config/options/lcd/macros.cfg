[gcode_macro BEEP]
gcode:
  SET_PIN PIN=beeper VALUE=1
  G4 P10  
  SET_PIN PIN=beeper VALUE=0

[gcode_macro _LCD_STATUS_PREHEATING]
description: Set the LCD illumination orange for print preparation
gcode:
  SET_LED LED=Screen_Colour RED=1 GREEN=0.5 BLUE=0 SYNC=0

[gcode_macro _LCD_STATUS_PRINTING]
description: Set the LCD illumination blue for active printing
gcode:
  SET_LED LED=Screen_Colour RED=0 GREEN=0 BLUE=1 SYNC=0

[gcode_macro _LCD_STATUS_PAUSED]
description: Set the LCD illumination yellow for pause or filament change
gcode:
  SET_LED LED=Screen_Colour RED=1 GREEN=1 BLUE=0 SYNC=0

[gcode_macro _LCD_STATUS_COMPLETE]
description: Set the LCD illumination green for a completed print
gcode:
  SET_LED LED=Screen_Colour RED=0 GREEN=1 BLUE=0 SYNC=0

[gcode_macro _LCD_STATUS_ERROR]
description: Set the LCD illumination red for cancellation or print error
gcode:
  SET_LED LED=Screen_Colour RED=1 GREEN=0 BLUE=0 SYNC=0
