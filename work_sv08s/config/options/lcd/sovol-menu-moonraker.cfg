### menu virtual sdcard ###
[menu __main __sdcard]
type: vsdlist
enable: {not (printer.print_stats.state == "paused" or printer.idle_timeout.state == "Printing")}
name: Print
index: 6

# Keep this row in the populated list so selecting a file with M23 does not
# require leaving and reopening the menu before the start action is available.
[menu __main __sdcard __start]
type: command
enable: {('virtual_sdcard' in printer) and not printer.virtual_sdcard.is_active}
name: {'Start printing' if printer.virtual_sdcard.file_path else 'Select file first'}
gcode:
    {% if printer.virtual_sdcard.file_path %}
        M24
        {menu.exit()}
    {% else %}
        M117 Select a file first
    {% endif %}

