name: Advanced
index: 10

# Hide Klipper's stock single-heater PID menu. The fleet workflow uses the
# machine-aware Multi PID Calibrate action under Calibration instead.
[menu __main __setup __tuning]
type: disabled

[menu __main __setup __calib]
type: list
name: Calibration

[menu __main __setup __calib __bedprobe]
type: disabled

[menu __main __setup __calib __autocalib]
type: command
name: Auto-calibration
gcode:
    AUTO_CALIBRATE
    {menu.exit()}

[menu __main __setup __calib __belt_test]
type: command
name: Belt resonance
gcode:
    BELT_RESONANCES
    {menu.exit()}

[menu __main __setup __calib __multi_pid]
type: command
name: Multi PID Calibrate
gcode:
    MULTI_PID_CALIBRATE
    {menu.exit()}

# These native tools require manual preparation; no automatic home or save.
# Frequency calibration exposes the native paper-test controls on the LCD.
# Tap calibration requires a clean/cool nozzle near bed center, 3-10mm above it.
[gcode_macro _EDDY_FREQUENCY_LCD]
description: Stores the LCD frequency-calibration Z increment and scroll position
variable_step_index: 0
variable_z_step: 0.01
variable_z_cursor: 0
gcode:
    {% set _ = 0 %}

[menu __main __setup __calib __eddy]
type: list
enable: {'probe_eddy_current eddy' in printer}
name: Eddy

[menu __main __setup __calib __eddy __frequency]
type: list
name: Frequency calibration

[menu __main __setup __calib __eddy __frequency __start]
type: command
enable: {not printer.manual_probe.is_active}
name: Start paper test
gcode:
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy

[menu __main __setup __calib __eddy __frequency __test_z]
type: input
enable: {printer.manual_probe.is_active}
name: Z increment: {['0.01','0.05','0.10','0.50'][menu.input|int]}
input: {printer['gcode_macro _EDDY_FREQUENCY_LCD'].step_index}
input_min: 0
input_max: 3
input_step: 1
realtime: True
gcode:
    {% if menu.event == 'change' %}
        SET_GCODE_VARIABLE MACRO=_EDDY_FREQUENCY_LCD VARIABLE=step_index VALUE={menu.input|int}
        SET_GCODE_VARIABLE MACRO=_EDDY_FREQUENCY_LCD VARIABLE=z_step VALUE={['0.01','0.05','0.10','0.50'][menu.input|int]}
    {% endif %}

[menu __main __setup __calib __eddy __frequency __move_z]
type: input
enable: {printer.manual_probe.is_active}
name: Move Z: {'%06.3f' % printer.manual_probe.z_position}
input: {printer['gcode_macro _EDDY_FREQUENCY_LCD'].z_cursor}
input_min: {printer['gcode_macro _EDDY_FREQUENCY_LCD'].z_cursor - 50}
input_max: {printer['gcode_macro _EDDY_FREQUENCY_LCD'].z_cursor + 50}
input_step: 1
realtime: True
gcode:
    {% set state = printer['gcode_macro _EDDY_FREQUENCY_LCD'] %}
    {% set ticks = (menu.input - state.z_cursor)|int %}
    {% if menu.event == 'change' and ticks != 0 %}
        TESTZ Z={'%.3f' % (ticks * state.z_step)}
        SET_GCODE_VARIABLE MACRO=_EDDY_FREQUENCY_LCD VARIABLE=z_cursor VALUE={menu.input|int}
    {% endif %}

[menu __main __setup __calib __eddy __frequency __accept]
type: command
enable: {printer.manual_probe.is_active}
name: Accept
gcode:
    ACCEPT

[menu __main __setup __calib __eddy __frequency __abort]
type: command
enable: {printer.manual_probe.is_active}
name: Abort
gcode:
    ABORT

[menu __main __setup __calib __eddy __tap_guess]
type: command
name: Tap guess
gcode:
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess

[menu __main __setup __calib __eddy __tap_refine]
type: command
name: Tap refine
gcode:
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=refine

[menu __main __setup __calib __eddy __tap_verify]
type: command
name: Tap verify
gcode:
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=verify

