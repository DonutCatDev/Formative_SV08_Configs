[menu __main __control __move_10mm __axis_e]
enable: {printer.extruder.can_extrude and not printer.pause_resume.is_paused and printer.print_stats.state != "printing"}
type: input
name: Move E:{'%+06.1f' % menu.input}
input: 0
input_min: -{printer.configfile.config.extruder.max_extrude_only_distance|default(50)}
input_max: {printer.configfile.config.extruder.max_extrude_only_distance|default(50)}
input_step: 10.0
gcode:
    {% if not (printer.extruder.can_extrude and not printer.pause_resume.is_paused and printer.print_stats.state != "printing") %}
        {action_raise_error("Manual movement unavailable in the current state.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=__move__axis
    M83
    G1 E{menu.input} F240
    RESTORE_GCODE_STATE NAME=__move__axis

