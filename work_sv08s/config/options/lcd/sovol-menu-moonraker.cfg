enable: {'z' in printer.toolhead.homed_axes and not printer.pause_resume.is_paused and printer.print_stats.state != "printing"}
type: input
name: Move Z:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z}
input_step: 10.0
gcode:
    {% if not ('z' in printer.toolhead.homed_axes and not printer.pause_resume.is_paused and printer.print_stats.state != "printing") %}
