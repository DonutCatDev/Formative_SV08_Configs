### menu resume ###
[menu __resume]
type: list
name: Resume

[menu __resume __resume]
type: command
name: Resume
gcode:
    # RESUME_INTERRUPTED

[menu __resume __cancel]
type: command
name: Cancel
gcode:
    # clear_last_file
    # SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    # RUN_SHELL_COMMAND CMD=clear_plr

### menu main ###
[menu __main]
type: list
name: Main

### menu tune ###
[menu __main __tune]
type: list
enable: {printer.print_stats.state == "paused" or printer.idle_timeout.state == "Printing"}
name: Tune
index: 1

[menu __main __tune __speed]
type: input
name: Speed: {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.speed_factor}
input_min: 0.01
input_max: 5
input_step: 0.01
realtime: True
gcode:
    M220 S{'%d' % (menu.input*100)}

[menu __main __tune __flow]
type: input
name: Flow: {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.extrude_factor}
input_min: 0.01
input_max: 2
input_step: 0.01
realtime: True
gcode:
    M221 S{'%d' % (menu.input*100)}

[menu __main __tune __fanspeed]
type: input
name: Fan speed: {'%3d' % (menu.input*100)}%
input: {printer["fan"].speed}
input_min: 0
input_max: 1
# More than 100 steps enables Klipper's automatic 10x fast-encoder step.
input_step: 0.005
gcode:
    M106 S{'%d' % (menu.input*255)}

[menu __main __tune __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
name: {"Ex0:%3.0f (%4.0f)" % (menu.input, printer.extruder.temperature)}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 1
gcode:
    M104 T0 S{'%.0f' % menu.input}

[menu __main __tune __hotend1_target]
type: input
enable: {('extruder1' in printer) and ('extruder1' in printer.heaters.available_heaters)}
name: {"Ex1:%3.0f (%4.0f)" % (menu.input, printer.extruder1.temperature)}
input: {printer.extruder1.target}
input_min: 0
input_max: {printer.configfile.config.extruder1.max_temp}
input_step: 1
gcode:
    M104 T1 S{'%.0f' % menu.input}

[menu __main __tune __hotbed_target]
type: input
enable: {'heater_bed' in printer}
name: {"Bed:%3.0f (%4.0f)" % (menu.input, printer.heater_bed.temperature)}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.config.heater_bed.max_temp}
input_step: 1
gcode:
    M140 S{'%.0f' % menu.input}

[menu __main __tune __exhaustfanonoff]
type: command
name: Exhaust Fan {'ON' if printer['fan_generic exhaust_fan'].speed > 0 else 'OFF'}
enable: {'fan_generic exhaust_fan' in printer}
gcode:
    {% if printer['fan_generic exhaust_fan'].speed > 0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1
    {% endif %}

[menu __main __tune __exhaustfanspeed]
type: input
name: Exhaust Fan:{'%3d' % (menu.input*100)}%
input: {printer["fan_generic exhaust_fan"].speed}
input_min: 0
input_max: 1
input_step: 0.01
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED={menu.input}

# yay dimming - MON5TERMATT
[menu __main __tune __ledonoff]
type: input
enable: {'led main_led' in printer}
name: Dim LED:    {'%3d%s' % (menu.input*100,'%') if menu.input else 'OFF'}
input: {printer['led main_led'].color_data[0][3]}
input_min: 0.0
input_max: 1.0
input_step: 0.01
gcode: SET_LED LED=main_led WHITE={menu.input}

[menu __main __tune __save]
type: disabled

[menu __main __tune __save __save_config]
type: disabled

[menu __main __filament1]
type: list
enable: {('virtual_sdcard' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: {'Runout recovery' if printer.print_stats.state == "paused" else 'Change filament'}
index: 2

[menu __main __filament1 __load]
type: command
enable: {printer.print_stats.state == "paused" and not printer['gcode_macro _FILAMENT_LOAD'].active}
name: Heat for loading
gcode:
    LOAD_FILAMENT
    {menu.exit()}

[menu __main __filament1 __confirm]
type: command
enable: {printer.print_stats.state == "paused" and printer['gcode_macro _FILAMENT_LOAD'].active}
name: Confirm loaded
gcode:
    CONFIRM_FILAMENT_LOADED
    {menu.exit()}

[menu __main __filament1 __cancel_load]
type: command
enable: {printer.print_stats.state == "paused" and printer['gcode_macro _FILAMENT_LOAD'].active}
name: Cancel loading
gcode:
    CANCEL_FILAMENT_LOAD
    {menu.exit()}

[menu __main __filament1 __unload]
type: command
enable: {printer.print_stats.state == "printing"}
name: Start filament change
gcode:
    M600
    {menu.exit()}

[menu __main __resume]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "paused"}
name: Resume printing
index: 3
gcode:
    M117 Resume printing
    {% if "pause_resume" in printer %}
        RESUME
    {% else %}
        M24
    {% endif %}
    {menu.exit()}

[menu __main __pause]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "printing"}
name: Pause printing
index: 3
gcode:
    M117 Pause printing
    {% if "pause_resume" in printer %}
        PAUSE
    {% else %}
        M25
    {% endif %}
    {menu.exit()}

[menu __main __cancel]
type: command
enable: {('virtual_sdcard' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Cancel printing
index: 3
gcode:
    # clear_last_file
    # SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    # RUN_SHELL_COMMAND CMD=clear_plr
    {% if 'pause_resume' in printer %}
        CANCEL_PRINT
    {% else %}
        M25
        M27
        M26 S0
        TURN_OFF_HEATERS
        {% if printer.toolhead.position.z <= printer.toolhead.axis_maximum.z - 5 %}
            G91
            G0 Z5 F1000
            G90
        {% endif %}
    {% endif %}
    {menu.exit()}

