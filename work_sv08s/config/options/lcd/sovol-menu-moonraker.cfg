### menu move 10mm ###
[menu __main __control __move_10mm]
type: list
name: Move 10mm

[menu __main __control __move_10mm __axis_x]
enable: {'x' in printer.toolhead.homed_axes and not printer.pause_resume.is_paused and printer.print_stats.state != "printing"}
type: input
name: Move X:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 10.0
gcode:
    {% if not ('x' in printer.toolhead.homed_axes and not printer.pause_resume.is_paused and printer.print_stats.state != "printing") %}
        {action_raise_error("Manual movement unavailable in the current state.")}
    {% endif %}
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 X{menu.input}
    RESTORE_GCODE_STATE NAME=__move__axis

